<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdasheild</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4eb;
      color: #123f24;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      max-width: 760px;
      padding: 60px 30px;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 12px;
      color: #0b4f25;
    }

    p {
      font-size: 22px;
      color: #4f5c53;
      line-height: 1.5;
    }

    .button {
      margin-top: 30px;
      display: inline-block;
      background: #bd8a17;
      color: white;
      padding: 14px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verdasheild</h1>
    <p>Commercial orchard protection systems for Australian fruit growers.</p>
    <a class="button" href="#">Website coming soon</a>
  </div>
</body>
</html>
